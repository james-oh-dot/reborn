# Publishes a preview of this branch WITHOUT changing what is live.
#
# GitHub Pages serves one site per repository, so a preview cannot be its own
# deployment: the site root is rebuilt from origin/main exactly as deploy-pages.yml
# builds it, and this branch is added underneath /preview/<slug>/. Visiting the domain
# root therefore still shows main; the preview only exists at the extra path.
#
# The preview pages are rewritten to load /assets/ from the site root instead of
# copying ~130MB of media a second time. Any asset this branch adds is merged in
# without overwriting a file main already publishes.
name: Deploy preview

on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PREVIEW_SLUG: flagship

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out live main beside the branch
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          mkdir -p live
          git archive origin/main | tar -x -C live

      - name: Build publish tree
        run: |
          set -euo pipefail
          mkdir -p publish/assets

          # 1. Site root — what deploy-pages.yml publishes from main, unchanged.
          cp -R live/work_in_progress/prototype/. publish/
          rsync -a --exclude='.DS_Store' --exclude='_raw' \
            live/work_in_progress/assets/ publish/assets/
          touch publish/.nojekyll
          if [ -f live/work_in_progress/CNAME ]; then
            cp live/work_in_progress/CNAME publish/CNAME
          fi

          # 2. Preview — this branch's pages, pointed at the root asset tree.
          mkdir -p "publish/preview/$PREVIEW_SLUG"
          cp -R work_in_progress/prototype/. "publish/preview/$PREVIEW_SLUG/"
          find "publish/preview/$PREVIEW_SLUG" \
            \( -name '*.html' -o -name '*.css' -o -name '*.js' \) \
            -exec sed -i 's#\.\./assets/#/assets/#g' {} +

          # 3. Assets this branch adds. --ignore-existing keeps every live file as is.
          rsync -a --ignore-existing --exclude='.DS_Store' --exclude='_raw' \
            work_in_progress/assets/ publish/assets/

      - name: Verify the site root still matches main
        run: |
          set -euo pipefail
          mkdir -p expected/assets
          cp -R live/work_in_progress/prototype/. expected/
          rsync -a --exclude='.DS_Store' --exclude='_raw' \
            live/work_in_progress/assets/ expected/assets/
          # publish/ additionally holds .nojekyll, CNAME and preview/; everything the
          # live build produces must be identical, or the deploy would change the site.
          diff -r --no-dereference expected publish/ \
            --exclude=preview --exclude=.nojekyll --exclude=CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Preview URL
        run: echo "Preview → ${{ steps.deployment.outputs.page_url }}preview/$PREVIEW_SLUG/work.html"
